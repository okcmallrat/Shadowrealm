[package]
name = "shadowrealm"
version = "0.1.0"
edition = "2021"
default-run = "shadowrealm"

[dependencies]

[features]
default = []
desktop = ["dep:minifb"]

[dependencies.minifb]
version = "=0.28.0"
optional = true
default-features = false
features = ["x11"]

[[bin]]
name = "shadowrealm-game"
path = "src/bin/game.rs"
required-features = ["desktop"]
